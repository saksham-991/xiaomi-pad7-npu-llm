<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#101014">
<meta name="color-scheme" content="dark">
<title>Pad7 NPU Chat</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<div class="blob b1"></div>
<div class="blob b2"></div>

<aside id="sidebar" class="sidebar">
  <div class="side-head">
    <div class="brand"><span class="brand-dot"></span> NPU Chat</div>
    <button id="newChat" class="icon-btn" title="New chat" aria-label="New chat">
      <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
    </button>
  </div>
  <div class="side-sub">Hexagon v73 · local</div>
  <div id="sessionList" class="sessions"></div>
  <div class="side-foot">
    <button id="exportBtn" class="text-btn">Export</button>
    <button id="importBtn" class="text-btn">Import</button>
    <input id="importFile" type="file" accept="application/json" hidden>
  </div>
</aside>

<main class="main">
  <header class="topbar">
    <button id="menuBtn" class="icon-btn only-mobile" aria-label="Menu">
      <svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
    </button>
    <div class="model-chip"><span class="pulse-dot"></span> LFM2-1.2B <span class="dim">· pure NPU</span></div>
    <div class="spacer"></div>
    <div id="ctxRing" class="ctx-ring" title="Context usage">
      <svg viewBox="0 0 36 36">
        <circle class="ring-bg" cx="18" cy="18" r="15.9"></circle>
        <circle id="ringFg" class="ring-fg" cx="18" cy="18" r="15.9"></circle>
      </svg>
      <span id="ctxPct">0%</span>
    </div>
  </header>

  <section id="messages" class="messages">
    <div id="empty" class="empty">
      <div class="empty-orb"></div>
      <h1>Your private AI,<br>on the NPU.</h1>
      <p>Runs 100% on the Hexagon tensor processor. No cloud. No GPU.</p>
      <div class="suggests">
        <button class="suggest" data-q="Explain how Qualcomm Hexagon HMX differs from HVX for matrix multiplies.">How HMX differs from HVX</button>
        <button class="suggest" data-q="search latest Android 16 QPR2 changes">Search: Android 16 QPR2</button>
        <button class="suggest" data-q="Write a Kotlin snippet for a Material You themed Compose app with dynamic color.">Compose + Material You</button>
      </div>
    </div>
  </section>

  <footer class="composer-wrap">
    <div class="composer">
      <textarea id="input" rows="1" placeholder="Message your on-device AI…"></textarea>
      <div class="composer-row">
        <div class="chips">
          <button id="chipSearch" class="chip" aria-pressed="false">
            <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4.3-4.3"/></svg> Search
          </button>
          <button id="chipThink" class="chip on" aria-pressed="true">
            <svg viewBox="0 0 24 24"><path d="M12 3a7 7 0 0 0-4 12.7V18a1 1 0 0 0 1 1h6a1 1 0 0 0 1-1v-2.3A7 7 0 0 0 12 3z"/><path d="M9 22h6"/></svg> Think
          </button>
        </div>
        <div class="spacer"></div>
        <button id="stopBtn" class="icon-btn danger hidden" title="Stop"><svg viewBox="0 0 24 24"><rect x="7" y="7" width="10" height="10" rx="2"/></svg></button>
        <button id="sendBtn" class="send" title="Send">
          <svg viewBox="0 0 24 24"><path d="M4 12l16-8-6 8 6 8-16-8z"/></svg>
        </button>
      </div>
    </div>
    <div class="hint">Local · private · <span id="tokHint">0</span>/16384 tokens</div>
  </footer>
</main>

<div id="toasts" class="toasts"></div>
<template id="msgTpl">
  <div class="msg">
    <div class="avatar"></div>
    <div class="bubble">
      <div class="reasoning hidden">
        <button class="reasoning-head">
          <span class="think-orb"></span>
          <span class="reasoning-title">Reasoning</span>
          <svg class="chev" viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg>
        </button>
        <div class="reasoning-body"></div>
      </div>
      <div class="content"></div>
      <div class="msg-foot">
        <button class="copy-btn" title="Copy">Copy</button>
        <span class="time"></span>
      </div>
    </div>
  </div>
</template>
<script src="/app.js"></script>
</body>
</html>
