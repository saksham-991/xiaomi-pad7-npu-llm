name: build-apk

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Ensure signing keystore (persistent across builds)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          API="https://api.github.com/repos/${{ github.repository }}"
          AUTH="Authorization: Bearer ${{ github.token }}"
          mkdir -p android/app
          curl -s -H "$AUTH" "$API/releases/tags/signing" -o /tmp/sig.json
          ASSET=$(python3 -c "import json;d=json.load(open('/tmp/sig.json'));print(next((a['url'] for a in d.get('assets',[]) if a['name']=='keystore.jks'),''))" || true)
          UPLOAD=$(python3 -c "import json;d=json.load(open('/tmp/sig.json'));print(d.get('upload_url','').split('{')[0])" || true)
          if [ -n "$ASSET" ]; then
            curl -sfL -H "$AUTH" -H "Accept: application/octet-stream" "$ASSET" -o android/app/keystore.jks
            echo "downloaded existing keystore"
          else
            if [ -z "$UPLOAD" ]; then
              UPLOAD=$(curl -s -X POST -H "$AUTH" -H "Accept: application/vnd.github+json" "$API/releases" \
                -d '{"tag_name":"signing","name":"signing","body":"stable APK signing key","draft":false,"prerelease":true}' \
                | python3 -c "import json,sys;print(json.load(sys.stdin)['upload_url'].split('{')[0])")
            fi
            keytool -genkeypair -keystore android/app/keystore.jks -alias npu -keyalg RSA -keysize 2048 -validity 10000 -storepass npuchat123 -keypass npuchat123 -dname "CN=Pad7NPU"
            curl -s -X POST -H "$AUTH" -H "Content-Type: application/java-archive" --data-binary @android/app/keystore.jks "$UPLOAD?name=keystore.jks" >/dev/null
            echo "generated and uploaded keystore"
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Build debug APK
        run: gradle -p android assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: pad7-npu-chat-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
